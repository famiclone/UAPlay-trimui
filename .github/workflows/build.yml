name: Build & Test (NextUI tg5040)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Smoke & Parser Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - name: Run offline C smoke tests
        run: make test

  build:
    name: Cross-compile UAPlay.pak (tg5040)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build tg5040 cross-toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.tg5040
          tags: uaplay-tg5040-builder:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Optionally embed TMDB API key from repository secret
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -eu
          if [ -z "${TMDB_API_KEY:-}" ]; then
            echo "::notice::TMDB_API_KEY secret is not set; building with runtime tmdb.key support."
            exit 0
          fi
          if [ "${#TMDB_API_KEY}" -ne 32 ]; then
            echo "::error::TMDB_API_KEY must be a 32-character TMDB v3 API key"
            exit 1
          fi
          case "$TMDB_API_KEY" in
            *[!0123456789abcdefABCDEF]*)
              echo "::error::TMDB_API_KEY must contain hexadecimal characters only"
              exit 1
              ;;
          esac
          umask 077
          {
            printf '#ifndef UAPLAY_TMDB_BUILD_KEY_H\n#define UAPLAY_TMDB_BUILD_KEY_H\n'
            printf '#define UAPLAY_TMDB_BUILD_KEY "%s"\n' "$TMDB_API_KEY"
            printf '#endif\n'
          } > source/tmdb_build_key.h

      - name: Build UAPlay.pak and UAPlay.pak.zip
        run: |
          docker run --rm \
            -v "$PWD:/root/workspace" \
            -w /root/workspace \
            uaplay-tg5040-builder:latest \
            make -j"$(nproc)" PLATFORM=trimui

      - name: Verify ARM64 ELF and Pak archive
        run: |
          set -eu
          test -s UAPlay.pak.zip
          test -x dist/Tools/tg5040/UAPlay.pak/uaplay
          test -x dist/Tools/tg5040/UAPlay.pak/launch.sh
          file dist/Tools/tg5040/UAPlay.pak/uaplay | grep -q "ARM aarch64"
          unzip -l UAPlay.pak.zip
          sha256sum UAPlay.pak.zip

      - name: Upload UAPlay.pak.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: UAPlay.pak
          path: UAPlay.pak.zip
          if-no-files-found: error
